services:

  mysql:
    image: mysql:8.0
    container_name: aquaguard-db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-aquaguard}
      - MYSQL_USER=${MYSQL_USER:-aquaguard}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-aquaguardpass}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-aquaguardrootpass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-aquaguardrootpass}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aquaguard-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aquaguard-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t aquaguard/healthcheck -m ping >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3
    container_name: aquaguard-turn
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-aquaguard.local}
      - --user=${TURN_USERNAME:-aquaguard}:${TURN_PASSWORD:-aquaguardpass}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --listening-ip=0.0.0.0
      - --min-port=${TURN_RELAY_MIN_PORT:-49152}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49200}/udp"
      - "${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49200}/tcp"
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aquaguard-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - APP_ENV=production
      - ALLOW_UNSAFE_WERKZEUG=1
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://aquaguard:aquaguardpass@mysql:3306/aquaguard}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-me}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - WEBRTC_SESSION_TTL_SECONDS=${WEBRTC_SESSION_TTL_SECONDS:-300}
      - WEBRTC_STUN_URLS=${WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302}
      - WEBRTC_TURN_URL=${WEBRTC_TURN_URL:-turn:aquaguard.local:3478?transport=udp}
      - WEBRTC_TURN_USERNAME=${WEBRTC_TURN_USERNAME:-aquaguard}
      - WEBRTC_TURN_CREDENTIAL=${WEBRTC_TURN_CREDENTIAL:-aquaguardpass}
      - WEBRTC_ICE_TRANSPORT_POLICY=${WEBRTC_ICE_TRANSPORT_POLICY:-all}
      - WEBRTC_FORCE_RELAY=${WEBRTC_FORCE_RELAY:-false}
      - AQUAGUARD_API_KEY=${AQUAGUARD_API_KEY:-dev-internal-api-key-change-me-32chars}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-aquaguard2026}
      - SEED_GUARD_PASSWORD=${SEED_GUARD_PASSWORD:-lifeguard2026}
    volumes:
      - ./backend/snapshots:/app/snapshots
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      coturn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
        REACT_APP_WEBRTC_STUN_URLS: ${REACT_APP_WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302}
        REACT_APP_WEBRTC_TURN_URL: ""
        REACT_APP_WEBRTC_TURN_USERNAME: ""
        REACT_APP_WEBRTC_TURN_CREDENTIAL: ""
        REACT_APP_WEBRTC_ICE_TRANSPORT_POLICY: ${REACT_APP_WEBRTC_ICE_TRANSPORT_POLICY:-all}
        REACT_APP_WEBRTC_FORCE_RELAY: ${REACT_APP_WEBRTC_FORCE_RELAY:-false}
        REACT_APP_WEBRTC_ENABLE: ${REACT_APP_WEBRTC_ENABLE:-true}
    container_name: aquaguard-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      coturn:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  detection_engine:
    build:
      context: ./detection_engine
    container_name: aquaguard-detection
    init: true
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - AQUAGUARD_API_URL=http://backend:5000
      - AQUAGUARD_API_KEY=${AQUAGUARD_API_KEY:-dev-internal-api-key-change-me-32chars}
      - RTSP_TRANSPORT=${RTSP_TRANSPORT:-udp}
      - AQUAGUARD_MODEL=${AQUAGUARD_MODEL:-aquaguard_yolov8s.pt}
      - RTSP_CONNECT_TIMEOUT=${RTSP_CONNECT_TIMEOUT:-10}
      - RTSP_READ_TIMEOUT=${RTSP_READ_TIMEOUT:-5}
      - RTSP_STALL_THRESHOLD=${RTSP_STALL_THRESHOLD:-10}
      - RTSP_BUFFER_SIZE=${RTSP_BUFFER_SIZE:-1}
      - TF_CPP_MIN_LOG_LEVEL=3
      - GLOG_minloglevel=3
      - GLOG_logtostderr=0
      - ABSL_LOG_LEVEL=3
    volumes:
      - ./detection_engine/models:/app/detection_engine/models:ro
      - ./config:/app/config:ro
      - ./backend/snapshots:/app/backend/snapshots
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4096M
          memory: 2048M
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

