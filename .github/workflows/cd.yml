# =============================================================================
# AquaGuard CD — Continuous Deployment Pipeline
# =============================================================================
# Trigger: push of a semver release tag (v*).
# Stage order: build → publish → deploy → verify (with auto-rollback).
# All third-party actions pinned to commit SHA.
# =============================================================================

name: AquaGuard CD

on:
  push:
    tags:
      - 'v*'

# ---------------------------------------------------------------------------
# Prevent parallel deploys — only one release at a time.
# ---------------------------------------------------------------------------
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend
  DETECTION_IMAGE_NAME: ${{ github.repository }}-detection

jobs:
  # ===========================================================================
  # Stage 1: BUILD & PUBLISH — build images, push to GHCR
  # ===========================================================================
  build-and-publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- Metadata extraction (tags + labels) for each service ----------------
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Extract metadata for Detection Engine
        id: meta-detection
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.DETECTION_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # -- Build and push each service -----------------------------------------
      - name: Build and push Backend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198e19c3bc3040 # v5.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198e19c3bc3040 # v5.4.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build and push Detection Engine image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198e19c3bc3040 # v5.4.0
        with:
          context: ./detection_engine
          push: true
          tags: ${{ steps.meta-detection.outputs.tags }}
          labels: ${{ steps.meta-detection.outputs.labels }}
          cache-from: type=gha,scope=detection
          cache-to: type=gha,scope=detection,mode=max

  # ===========================================================================
  # Stage 2: DEPLOY — pull new images and restart services
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # -- Environment protection: requires manual approval in GitHub settings ---
    # Configure at: Settings → Environments → production → Required reviewers
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - name: Manual approval gate
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367 # v1.12.0
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: Cerjho
          minimum-approvals: 1
          issue-title: "Deploy AquaGuard ${{ github.ref_name }} to production"
          issue-body: |
            Release **${{ github.ref_name }}** is ready for production deployment.

            **Approve** by commenting: `approved`
            **Deny** by commenting: `denied`

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v3.1.2 / v4.1.2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/aquaguard

            # ---------------------------------------------------------------
            # Record the currently deployed image digest for rollback.
            # ---------------------------------------------------------------
            PREV_BACKEND_IMAGE=$(docker inspect --format='{{index .Image}}' aquaguard-backend 2>/dev/null || echo "none")
            echo "Previous backend image: ${PREV_BACKEND_IMAGE}" | tee /opt/aquaguard/.previous-deploy

            # ---------------------------------------------------------------
            # Set the version being deployed and pull new images.
            # ---------------------------------------------------------------
            export APP_VERSION=${{ github.ref_name }}
            echo "Deploying AquaGuard ${APP_VERSION}..."

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # ---------------------------------------------------------------
            # Restart services with the new images.
            # ---------------------------------------------------------------
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # ---------------------------------------------------------------
            # Post-deploy health check — verify backend responds within 90s.
            # If it fails, trigger automatic rollback.
            # ---------------------------------------------------------------
            echo "Waiting for backend health check..."
            HEALTHY=false
            for i in $(seq 1 45); do
              if curl -fsS --max-time 3 http://localhost:5000/api/health > /dev/null 2>&1; then
                echo "Health check passed after $((i * 2)) seconds"
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "ERROR: Health check failed after 90 seconds!"
              echo "Initiating automatic rollback..."

              # Show failing container logs for debugging
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 backend

              # Rollback: restart with previous images (they're still cached locally)
              docker compose -f docker-compose.yml -f docker-compose.prod.yml down
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

              echo "ROLLBACK COMPLETE — previous deployment restored."
              echo "Manual investigation required. Check /opt/aquaguard/.previous-deploy"
              exit 1
            fi

            echo "Deployment of ${APP_VERSION} successful!"

            # ---------------------------------------------------------------
            # Clean up old images to save disk space.
            # ---------------------------------------------------------------
            docker image prune -af --filter "until=24h"
