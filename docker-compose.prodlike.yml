services:
  backend:
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://aquaguard.local}
      - JWT_COOKIE_SECURE=true

  frontend:
    build:
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
        REACT_APP_WEBRTC_TURN_URL: ${REACT_APP_WEBRTC_TURN_URL:-turn:aquaguard.local:3478?transport=udp}

  edge:
    image: caddy:2.8-alpine
    container_name: aquaguard-edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

