services:

  mysql:
    image: mysql:8.0
    container_name: aquaguard-db
    command: >
      --default-authentication-plugin=mysql_native_password
      --max-connections=50
      --max_allowed_packet=16M
      --table-open-cache=500
      --innodb-buffer-pool-size=200M
      --innodb-log-buffer-size=8M
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aquaguard-redis
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aquaguard-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t aquaguard/healthcheck -m ping >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3
    container_name: aquaguard-turn
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-ip=0.0.0.0
      - --min-port=${TURN_RELAY_MIN_PORT}
      - --max-port=${TURN_RELAY_MAX_PORT}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}:${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}/udp"
      - "${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}:${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}/tcp"
    healthcheck:
      test: [ "CMD", "turnutils_stunclient", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aquaguard-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - APP_ENV=production
      - ALLOW_UNSAFE_WERKZEUG=1
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # LAN-safe defaults for cookie auth over HTTP; override to true for HTTPS.
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-false}
      - JWT_COOKIE_SAMESITE=${JWT_COOKIE_SAMESITE:-Lax}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - REDIS_URL=${REDIS_URL}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - WEBRTC_SESSION_TTL_SECONDS=${WEBRTC_SESSION_TTL_SECONDS}
      - WEBRTC_STUN_URLS=${WEBRTC_STUN_URLS}
      - WEBRTC_TURN_URL=${WEBRTC_TURN_URL}
      - WEBRTC_TURN_USERNAME=${WEBRTC_TURN_USERNAME}
      - WEBRTC_TURN_CREDENTIAL=${WEBRTC_TURN_CREDENTIAL}
      - WEBRTC_ICE_TRANSPORT_POLICY=${WEBRTC_ICE_TRANSPORT_POLICY}
      - WEBRTC_FORCE_RELAY=${WEBRTC_FORCE_RELAY}
      - AQUAGUARD_API_KEY=${AQUAGUARD_API_KEY}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SEED_GUARD_PASSWORD=${SEED_GUARD_PASSWORD}
      # Stream server: detection engine's in-memory MJPEG endpoint
      - STREAM_SERVER_URL=http://detection_engine:8765
    volumes:
      - ./backend/snapshots:/app/snapshots
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      coturn:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty defaults let the frontend use runtime same-origin (recommended for LAN).
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
        REACT_APP_WEBRTC_STUN_URLS: ${REACT_APP_WEBRTC_STUN_URLS}
        REACT_APP_WEBRTC_TURN_URL: ""
        REACT_APP_WEBRTC_TURN_USERNAME: ""
        REACT_APP_WEBRTC_TURN_CREDENTIAL: ""
        REACT_APP_WEBRTC_ICE_TRANSPORT_POLICY: ${REACT_APP_WEBRTC_ICE_TRANSPORT_POLICY}
        REACT_APP_WEBRTC_FORCE_RELAY: ${REACT_APP_WEBRTC_FORCE_RELAY}
        REACT_APP_WEBRTC_ENABLE: ${REACT_APP_WEBRTC_ENABLE}
    container_name: aquaguard-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      coturn:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  detection_engine:
    build:
      context: ./detection_engine
    container_name: aquaguard-detection
    init: true
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - AQUAGUARD_API_URL=http://backend:5000
      - AQUAGUARD_API_KEY=${AQUAGUARD_API_KEY}
      - RTSP_TRANSPORT=${RTSP_TRANSPORT}
      - AQUAGUARD_MODEL=${AQUAGUARD_MODEL}
      - RTSP_CONNECT_TIMEOUT=${RTSP_CONNECT_TIMEOUT}
      - RTSP_READ_TIMEOUT=${RTSP_READ_TIMEOUT}
      - RTSP_STALL_THRESHOLD=${RTSP_STALL_THRESHOLD}
      - RTSP_BUFFER_SIZE=${RTSP_BUFFER_SIZE}
      - DETECTION_GPU_MEMORY_FRACTION=${DETECTION_GPU_MEMORY_FRACTION}
      - DETECTION_GPU_CACHE_CLEAR_INTERVAL_FRAMES=${DETECTION_GPU_CACHE_CLEAR_INTERVAL_FRAMES}
      - DETECTION_GPU_MONITOR_ENABLED=${DETECTION_GPU_MONITOR_ENABLED}
      - DETECTION_GPU_MONITOR_INTERVAL_SECONDS=${DETECTION_GPU_MONITOR_INTERVAL_SECONDS}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES}
      - TF_CPP_MIN_LOG_LEVEL=3
      - GLOG_minloglevel=3
      - GLOG_logtostderr=0
      - ABSL_LOG_LEVEL=3
      # Stream server port (in-memory MJPEG)
      - STREAM_SERVER_PORT=${STREAM_SERVER_PORT:-8765}
    ports:
      - "8765:8765"
    volumes:
      - ./detection_engine/models:/app/detection_engine/models:ro
      - ./config:/app/config:ro
      - ./backend/snapshots:/app/backend/snapshots
      - ./backend/clips:/app/backend/clips
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 5120M
          cpus: '3'
        reservations:
          memory: 4096M
          cpus: '2.5'
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
