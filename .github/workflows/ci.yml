# =============================================================================
# AquaGuard CI — Continuous Integration Pipeline
# =============================================================================
# Trigger: push to dev/feature/fix branches + PRs targeting dev or main.
# Stage order: lint (fastest) → unit tests (parallel) → integration tests.
# All third-party actions pinned to commit SHA to prevent supply chain attacks.
# =============================================================================

name: AquaGuard CI

on:
  push:
    branches: [ dev, 'feature/**', 'fix/**', 'refactor/**' ]
  pull_request:
    branches: [ dev, main ]

# ---------------------------------------------------------------------------
# Least-privilege permissions — only read repo contents by default.
# Individual jobs escalate only what they need.
# ---------------------------------------------------------------------------
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Cancel in-progress runs on the same branch/PR to save runner minutes.
# Production (main) runs are never cancelled.
# ---------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ===========================================================================
  # Stage 1: LINT — fastest feedback, fails first
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Install linters
        run: pip install flake8==7.1.1

      - name: Lint Python (backend)
        run: flake8 backend/ --exclude=backend/migrations/ --extend-ignore=W293,E501,F401,F541,F841

      - name: Lint Python (detection engine)
        run: flake8 detection_engine/ --extend-ignore=W293,E501,F401,F541,F841

  # ===========================================================================
  # Stage 2: UNIT & COMPONENT TESTS — run in parallel (no cross-dependencies)
  # ===========================================================================
  test-backend:
    name: Backend Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install flask==3.1.3 flask-socketio==5.3.6 flask-jwt-extended==4.6.0
          pip install flask-sqlalchemy==3.1.1 flask-migrate==4.0.7 flask-cors==6.0.0
          pip install flask-bcrypt==1.0.1 python-socketio==5.14.0 python-engineio==4.12.3
          pip install paho-mqtt==2.1.0
          pip install Flask-Limiter==3.8.0 Pillow==12.1.1 redis==5.1.1
          pip install python-dotenv==1.2.2 pymysql==1.1.1 requests==2.32.4
          pip install pytest==8.3.3 pytest-cov==5.0.0 pytest-mock==3.14.0 httpx==0.27.2

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          MQTT_BROKER_HOST: localhost
          MQTT_BROKER_PORT: 1883

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: backend/coverage.xml
          flags: backend

  test-detection-engine:
    name: Detection Engine Tests (CPU only in CI)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Install detection engine dependencies
        run: |
          pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.0 mediapipe==0.10.14 opencv-python-headless==4.10.0.84
          pip install numpy==1.26.4 paho-mqtt==2.1.0 requests==2.32.4
          pip install pytest==8.3.3 pytest-cov==5.0.0 pytest-mock==3.14.0
          pip install -e ./detection_engine

      - name: Run detection engine tests (CPU mode)
        run: |
          pytest detection_engine/tests/ -v --cov=detection_engine --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: coverage.xml
          flags: detection-engine

  test-frontend-unit:
    name: Frontend Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:unit
        env:
          CI: true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          REACT_APP_API_URL: http://localhost:5000
          REACT_APP_WS_URL: http://localhost:5000

  # ===========================================================================
  # Stage 3: INTEGRATION / E2E TESTS — depend on unit tests passing first
  # ===========================================================================
  test-frontend-e2e:
    name: Frontend E2E Tests (Playwright)
    needs: [test-backend, test-frontend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: |
          pip install flask==3.1.3 flask-socketio==5.3.6 flask-jwt-extended==4.6.0
          pip install flask-sqlalchemy==3.1.1 flask-migrate==4.0.7 flask-cors==6.0.0
          pip install flask-bcrypt==1.0.1 python-socketio==5.14.0 python-engineio==4.12.3
          pip install paho-mqtt==2.1.0
          pip install Flask-Limiter==3.8.0 Pillow==12.1.1 redis==5.1.1
          pip install python-dotenv==1.2.2 pymysql==1.1.1 requests==2.32.4

      - name: Set up test database
        run: |
          cd backend
          python -c "from app import create_app; from extensions import db; app = create_app(); app.app_context().push(); db.create_all()"
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          SECRET_KEY: ci-test-secret-key
          AQUAGUARD_API_KEY: ci-test-api-key
          SEED_ADMIN_PASSWORD: aquaguard2026
          SEED_GUARD_PASSWORD: lifeguard2026

      - name: Seed test data
        run: |
          cd backend
          python scripts/seed.py
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          SECRET_KEY: ci-test-secret-key
          AQUAGUARD_API_KEY: ci-test-api-key
          SEED_ADMIN_PASSWORD: aquaguard2026
          SEED_GUARD_PASSWORD: lifeguard2026

      - name: Start backend server
        run: |
          cd backend
          python wsgi.py &
          # Wait for backend to be ready — fail explicitly if it doesn't start
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "ERROR: Backend failed to start within 60 seconds"
          exit 1
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          SECRET_KEY: ci-test-secret-key
          AQUAGUARD_API_KEY: ci-test-api-key
          SEED_ADMIN_PASSWORD: aquaguard2026
          SEED_GUARD_PASSWORD: lifeguard2026
          RESET_DEFAULT_PASSWORDS_ON_STARTUP: 1
          RATELIMIT_ENABLED: 0
          FLASK_DEBUG: 0
          ALLOW_UNSAFE_WERKZEUG: 1

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          npm run test:e2e -- --project=chromium
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:5000

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: frontend/e2e/reports/
          retention-days: 7

  # ===========================================================================
  # Stage 3 (parallel): COMPOSE DEPLOYMENT GATE
  # ===========================================================================
  compose-deployment-gate:
    name: Compose Deployment Gate
    needs: [test-backend, test-frontend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare compose environment
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          APP_ENV=production
          SECRET_KEY=ci-secret-key-change-me-1234567890
          JWT_SECRET_KEY=ci-jwt-secret-key-change-me-1234567890
          AQUAGUARD_API_KEY=ci-internal-api-key-change-me-1234567890
          SEED_ADMIN_PASSWORD=aquaguard2026
          SEED_GUARD_PASSWORD=lifeguard2026
          DATABASE_URL=mysql+pymysql://aquaguard:aquaguardpass@mysql:3306/aquaguard
          CORS_ALLOWED_ORIGINS=https://aquaguard.ci.local
          RATELIMIT_STORAGE_URI=redis://redis:6379/1
          REACT_APP_API_URL=http://localhost:5000
          REACT_APP_WS_URL=http://localhost:5000
          EOF

      - name: Validate compose contract
        run: |
          docker compose --env-file .env config > /tmp/aquaguard-compose.rendered.yml

      - name: Start compose services
        run: |
          # Exclude coturn — it binds port 49200 which conflicts on shared CI runners
          docker compose --env-file .env up -d --build mysql redis mosquitto backend frontend

      - name: Wait for backend and frontend readiness
        run: |
          for i in {1..90}; do
            backend_status="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || true)"
            frontend_status="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)"

            if [ "$backend_status" = "200" ] && [ "$frontend_status" = "200" ]; then
              echo "Compose services are ready"
              exit 0
            fi

            if [ "$i" -eq 90 ]; then
              echo "ERROR: Timed out waiting for compose services"
              echo "Backend status: $backend_status"
              echo "Frontend status: $frontend_status"
              docker compose --env-file .env ps
              exit 1
            fi

            sleep 2
          done

      - name: Run backend smoke assertions
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request


          def request(url: str, method: str = "GET", data: dict | None = None, headers: dict | None = None):
              payload = None
              if data is not None:
                  payload = json.dumps(data).encode("utf-8")
              req = urllib.request.Request(url=url, method=method, data=payload)
              if headers:
                  for key, value in headers.items():
                      req.add_header(key, value)
              if data is not None:
                  req.add_header("Content-Type", "application/json")

              with urllib.request.urlopen(req, timeout=10) as response:
                  body = response.read().decode("utf-8")
                  return response.status, body


          health_status, _ = request("http://localhost:5000/api/health")
          if health_status != 200:
              raise SystemExit(f"Expected /api/health=200, got {health_status}")

          login_status, login_body = request(
              "http://localhost:5000/api/v1/auth/login",
              method="POST",
              data={"username": "admin", "password": "aquaguard2026"},
          )
          if login_status != 200:
              raise SystemExit(f"Expected login=200, got {login_status}. body={login_body}")

          token = json.loads(login_body).get("access_token")
          if not token:
              raise SystemExit("Login response did not include access_token")

          system_status, _ = request(
              "http://localhost:5000/api/v1/system/status",
              headers={"Authorization": f"Bearer {token}"},
          )
          if system_status != 200:
              raise SystemExit(f"Expected system status=200, got {system_status}")
          PY

      - name: Show compose status and logs
        if: always()
        run: |
          docker compose --env-file .env ps
          docker compose --env-file .env logs --no-color --tail=120 backend frontend mysql redis mosquitto

      - name: Tear down compose services
        if: always()
        run: |
          docker compose --env-file .env down -v --remove-orphans

  # ===========================================================================
  # Stage 2 (parallel): SECURITY SCAN — non-blocking advisory
  # ===========================================================================
  security-scan:
    name: Security Scan (Non-Blocking)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install security scanners
        run: |
          pip install pip-audit==2.8.0
          cd frontend
          npm ci

      - name: Python dependency audit
        run: |
          pip-audit -r backend/requirements.txt \
            --ignore-vuln GHSA-mf9w-mj56-hr94
          pip-audit -r detection_engine/requirements.txt \
            --ignore-vuln PYSEC-2025-41 \
            --ignore-vuln PYSEC-2024-259 \
            --ignore-vuln GHSA-3749-ghw9-m3mg \
            --ignore-vuln GHSA-887c-mr87-cxwp \
            --ignore-vuln GHSA-7gcm-g887-7qv7

      - name: Frontend dependency audit
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high
