name: AquaGuard CI

on:
  push:
    branches: [ dev, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ dev, main ]

jobs:

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install flask==3.1.3 flask-socketio==5.3.6 flask-jwt-extended==4.6.0
          pip install flask-sqlalchemy==3.1.1 flask-migrate==4.0.7 flask-cors==6.0.0
          pip install flask-bcrypt==1.0.1 python-socketio==5.14.0 python-engineio==4.12.3
          pip install Flask-Limiter==3.8.0 Pillow==12.1.1 redis==5.1.1
          pip install python-dotenv==1.0.1 pymysql==1.1.1 requests==2.32.4
          pip install pytest==8.3.3 pytest-cov==5.0.0 pytest-mock==3.14.0 httpx==0.27.2

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          MQTT_BROKER_HOST: localhost
          MQTT_BROKER_PORT: 1883

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  test-detection-engine:
    name: Detection Engine Tests (CPU only in CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Install detection engine dependencies
        run: |
          pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.0 mediapipe==0.10.14 opencv-python-headless==4.10.0.84
          pip install numpy==1.26.4 paho-mqtt==2.1.0 requests==2.32.4
          pip install pytest==8.3.3 pytest-cov==5.0.0 pytest-mock==3.14.0
          pip install -e ./detection_engine

      - name: Run detection engine tests (CPU mode)
        run: |
          pytest detection_engine/tests/ -v --cov=detection_engine --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: detection-engine

  test-frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:unit
        env:
          CI: true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          REACT_APP_API_URL: http://localhost:5000
          REACT_APP_WS_URL: http://localhost:5000

  test-frontend-e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: |
          pip install flask==3.1.3 flask-socketio==5.3.6 flask-jwt-extended==4.6.0
          pip install flask-sqlalchemy==3.1.1 flask-migrate==4.0.7 flask-cors==6.0.0
          pip install flask-bcrypt==1.0.1 python-socketio==5.14.0 python-engineio==4.12.3
          pip install Flask-Limiter==3.8.0 Pillow==12.1.1 redis==5.1.1
          pip install python-dotenv==1.0.1 pymysql==1.1.1 requests==2.32.4

      - name: Set up test database
        run: |
          cd backend
          python -c "from app import create_app; from extensions import db; app = create_app(); app.app_context().push(); db.create_all()"
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          SECRET_KEY: ci-test-secret-key
          AQUAGUARD_API_KEY: ci-test-api-key

      - name: Seed test data
        run: |
          cd backend
          python seed.py
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          SECRET_KEY: ci-test-secret-key
          AQUAGUARD_API_KEY: ci-test-api-key
          SEED_ADMIN_PASSWORD: aquaguard2026

      - name: Start backend server
        run: |
          cd backend
          python wsgi.py &
          sleep 5
        env:
          DATABASE_URL: sqlite:///test_aquaguard.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          SECRET_KEY: ci-test-secret-key
          AQUAGUARD_API_KEY: ci-test-api-key
          FLASK_DEBUG: 0
          ALLOW_UNSAFE_WERKZEUG: 1

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/e2e/reports/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Install linters
        run: pip install flake8==7.1.1

      - name: Lint Python (backend)
        run: flake8 backend/ --exclude=backend/migrations/

      - name: Lint Python (detection engine)
        run: flake8 detection_engine/

  security-scan:
    name: Security Scan (Non-Blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            detection_engine/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install security scanners
        run: |
          pip install pip-audit==2.8.0
          cd frontend
          npm ci

      - name: Python dependency audit
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r detection_engine/requirements.txt \
            --ignore-vuln PYSEC-2025-41 \
            --ignore-vuln PYSEC-2024-259 \
            --ignore-vuln GHSA-3749-ghw9-m3mg \
            --ignore-vuln GHSA-887c-mr87-cxwp \
            --ignore-vuln GHSA-7gcm-g887-7qv7

      - name: Frontend dependency audit
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high
